server:
  port: ${IDENTITY_SERVICE_PORT:8081}
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_URL_DB:jdbc:mysql://localhost:3306/identity_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${IDENTITY_DB_USERNAME:root}
    password: ${IDENTITY_DB_PASSWORD:mysqladmin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: identity-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
