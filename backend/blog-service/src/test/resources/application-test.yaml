server:
  port: 0

spring:
  application:
    name: blog-service
  datasource:
    url: jdbc:h2:mem:blog_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

services:
  identity-service:
    url: http://localhost:8081/identity

minio:
  url: http://localhost:9000
  public-url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: lms-blog-bucket
  max-file-size-bytes: 5242880
  public-read-enabled: true

blog:
  storage:
    thumbnail-folder: thumbnails
