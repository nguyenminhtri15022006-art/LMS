<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::content}, ~{::title}, ~{}, ~{::extraJs})}">
<head>
    <title th:fragment="title">Đăng Nhập - EduLearn LMS</title>
</head>
<body>
<div th:fragment="content" class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <div class="display-6 mb-2">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Đăng Nhập EduLearn</h4>
                        <p class="small text-white-50 mb-0">Hệ thống Quản lý Học tập & Luyện Code</p>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <!-- Success message -->
                        <div th:if="${success}" class="alert alert-success d-flex align-items-center gap-2 alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${success}">Đăng ký thành công!</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Info message -->
                        <div th:if="${info}" class="alert alert-info d-flex align-items-center gap-2 alert-dismissible fade show" role="alert">
                            <i class="bi bi-info-circle-fill"></i>
                            <span th:text="${info}">Thông báo.</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Error message -->
                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <span th:text="${error}">Đăng nhập thất bại!</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/auth/login}" th:object="${loginDto}" method="post">
                            <input type="hidden" name="redirectUrl" th:value="${param.redirectUrl}" />

                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập hoặc Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" id="username" th:field="*{username}" class="form-control border-start-0" placeholder="student / instructor / admin" required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-semibold mb-0">Mật khẩu</label>
                                    <a href="#" class="small text-decoration-none text-muted">Quên mật khẩu?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">
                                    Ghi nhớ đăng nhập trên thiết bị này
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                            </button>
                        </form>

                        <!-- Quick Demo Accounts for grading & testing -->
                        <div class="mt-4 pt-3 border-top text-center">
                            <div class="small text-muted fw-semibold mb-2">Tài khoản kiểm thử nhanh (Demo):</div>
                            <div class="d-flex justify-content-center gap-2 flex-wrap">
                                <button type="button" class="btn btn-sm btn-outline-primary demo-btn" onclick="fillDemo('student', '12345678')">
                                    <i class="bi bi-person-fill"></i> Học Viên
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-success demo-btn" onclick="fillDemo('instructor', '12345678')">
                                    <i class="bi bi-mortarboard"></i> Giảng Viên
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger demo-btn" onclick="fillDemo('admin', '12345678')">
                                    <i class="bi bi-shield-lock"></i> Quản Trị
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-light text-center py-3 border-0">
                        <span class="small text-muted">Chưa có tài khoản?</span>
                        <a th:href="@{/auth/register}" class="small fw-bold text-decoration-none ms-1">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:fragment="extraJs">
    <script>
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
</th:block>
</body>
</html>
