<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <span class="badge bg-primary fs-5 p-2 rounded-3">
                <i class="bi bi-mortarboard-fill"></i>
            </span>
            <span>EduLearn <span class="text-primary">LMS</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i>Trang chủ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/courses}">
                        <i class="bi bi-journal-text me-1"></i>Khóa học
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/problems}">
                        <i class="bi bi-code-slash me-1"></i>Luyện Code
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-info fw-semibold" th:href="@{/quizzes}">
                        <i class="bi bi-patch-question me-1"></i>Thi Quiz
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/blog}">
                        <i class="bi bi-chat-square-text me-1"></i>Diễn đàn
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/auth/login}" class="btn btn-outline-light btn-sm px-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                </a>
                <a th:href="@{/auth/register}" class="btn btn-primary btn-sm px-3 fw-semibold">
                    <i class="bi bi-person-plus me-1"></i>Đăng ký
                </a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
