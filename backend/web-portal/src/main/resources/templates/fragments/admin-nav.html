<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="adminNav(activeNav)" class="card shadow-sm border-0 mb-4 bg-white rounded-3">
    <div class="card-body p-3">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-danger px-3 py-2 fs-6 rounded-pill">
                    <i class="bi bi-shield-lock-fill me-1"></i>Trung Tâm Quản Trị
                </span>
                <span class="text-muted small d-none d-md-inline">| Quản lý toàn diện hệ thống EduLearn LMS</span>
            </div>
            <ul class="nav nav-pills gap-1">
                <li class="nav-item">
                    <a class="nav-link py-2 px-3 fw-semibold" th:classappend="${activeNav == 'dashboard' ? 'active bg-primary' : 'text-dark'}" th:href="@{/admin}">
                        <i class="bi bi-speedometer2 me-1"></i>Tổng quan
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-2 px-3 fw-semibold" th:classappend="${activeNav == 'users' ? 'active bg-primary' : 'text-dark'}" th:href="@{/admin/users}">
                        <i class="bi bi-people-fill me-1"></i>Người dùng
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-2 px-3 fw-semibold" th:classappend="${activeNav == 'courses' ? 'active bg-primary' : 'text-dark'}" th:href="@{/admin/courses}">
                        <i class="bi bi-journal-bookmark-fill me-1"></i>Khóa học
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-2 px-3 fw-semibold" th:classappend="${activeNav == 'categories' ? 'active bg-primary' : 'text-dark'}" th:href="@{/admin/categories}">
                        <i class="bi bi-folder-fill me-1"></i>Thể loại
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link py-2 px-3 fw-semibold" th:classappend="${activeNav == 'tags' ? 'active bg-primary' : 'text-dark'}" th:href="@{/admin/tags}">
                        <i class="bi bi-tags-fill me-1"></i>Thẻ Tags
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
