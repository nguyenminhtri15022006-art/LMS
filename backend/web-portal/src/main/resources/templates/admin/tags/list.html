<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#adminTagsContent}, ~{::#adminScripts})}">
<head>
    <title>Quản Lý Thẻ Diễn Đàn - EduLearn LMS Admin</title>
</head>
<body>
<div id="adminTagsContent" class="container py-4">
    <!-- Admin Navigation -->
    <div th:replace="~{fragments/admin-nav :: adminNav('tags')}"></div>

    <!-- Header Actions -->
    <div class="card shadow-sm border-0 rounded-3 mb-4 bg-white">
        <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-tags-fill text-danger me-2"></i>Thẻ Tags Diễn Đàn</h4>
                <p class="text-muted small mb-0">Quản trị các chủ đề và từ khóa thảo luận trong Cộng đồng EduLearn</p>
            </div>
            <button type="button" class="btn btn-danger fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#tagModal" onclick="prepareTagModal('add')">
                <i class="bi bi-plus-circle me-1"></i>Thêm Thẻ Tag Mới
            </button>
        </div>
    </div>

    <!-- Tags Table -->
    <div class="card shadow-sm border-0 rounded-3 bg-white">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="ps-4" style="width: 80px;">ID</th>
                            <th>Tên Thẻ Tag</th>
                            <th>Đường Dẫn Slug</th>
                            <th class="text-end pe-4" style="width: 150px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:if="${tags != null && tags.size() > 0}">
                            <tr th:each="tag : ${tags}">
                                <td class="ps-4 fw-bold text-secondary" th:text="${tag.has('id')} ? ${tag.get('id').asText()} : '—'">1</td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill fs-6 fw-semibold">
                                        <i class="bi bi-hash me-1"></i><span th:text="${tag.has('name')} ? ${tag.get('name').asText()} : 'Tag'">Java</span>
                                    </span>
                                </td>
                                <td>
                                    <code class="text-danger bg-light px-2 py-1 rounded" th:text="${tag.has('slug')} ? ${tag.get('slug').asText()} : 'slug'">java</code>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group btn-group-sm">
                                        <!-- Nút Sửa -->
                                        <button type="button" class="btn btn-outline-secondary btn-edit-tag"
                                                th:attr="data-tag-id=${tag.get('id').asText()}, data-tag-name=${tag.get('name').asText()}, data-tag-slug=${tag.has('slug') ? tag.get('slug').asText() : ''}"
                                                title="Chỉnh sửa">
                                            <i class="bi bi-pencil-fill text-primary"></i>
                                        </button>

                                        <!-- Nút Xóa -->
                                        <form th:action="@{/admin/tags/{id}/delete(id=${tag.get('id').asText()})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa thẻ này? Các bài viết gắn thẻ này sẽ mất liên kết.');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-secondary" title="Xóa thẻ tag">
                                                <i class="bi bi-trash3-fill text-danger"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </th:block>
                        <tr th:if="${tags == null || tags.size() == 0}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-tag fs-1 d-block mb-2 text-secondary"></i>
                                Chưa có thẻ tag nào được tạo.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm / Sửa Tag -->
    <div class="modal fade" id="tagModal" tabindex="-1" aria-labelledby="tagModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form id="tagForm" method="post" th:action="@{/admin/tags}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header bg-danger bg-opacity-10">
                        <h5 class="modal-title fw-bold text-dark" id="tagModalLabel"><i class="bi bi-tag-fill text-danger me-2"></i>Thêm Thẻ Tag Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên thẻ tag <span class="text-danger">*</span></label>
                            <input type="text" id="tagInputName" name="name" class="form-control" placeholder="Ví dụ: Spring Boot" required maxlength="50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Slug (Đường dẫn thân thiện) <span class="text-danger">*</span></label>
                            <input type="text" id="tagInputSlug" name="slug" class="form-control" placeholder="spring-boot" required maxlength="50">
                            <div class="form-text small">Tự động tạo từ tên hoặc nhập thủ công (không dấu, cách nhau bởi gạch nối)</div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" id="btnSubmitTag" class="btn btn-danger fw-semibold px-4"><i class="bi bi-check-lg me-1"></i>Lưu Thẻ Tag</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block id="adminScripts">
    <script th:src="@{/js/admin-actions.js}"></script>
</th:block>
</body>
</html>
