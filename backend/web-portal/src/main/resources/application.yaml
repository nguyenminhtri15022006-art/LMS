server:
  port: ${PORT:8086}

spring:
  application:
    name: web-portal
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
