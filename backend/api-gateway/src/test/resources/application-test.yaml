server:
  port: 0

app:
  prefix-api: /api

jwt:
  signer-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

spring:
  application:
    name: api-gateway
  cloud:
    discovery:
      enabled: false
    gateway:
      routes:
        # ===== Public actuator health endpoints =====
        - id: identity-health
          uri: lb://identity-service
          order: -100
          predicates:
            - Path=${app.prefix-api}/identity/actuator/**
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: course-health
          uri: lb://course-service
          order: -100
          predicates:
            - Path=${app.prefix-api}/course/actuator/**
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: assignment-health
          uri: lb://assignment-service
          order: -100
          predicates:
            - Path=${app.prefix-api}/assignment/actuator/**
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: blog-health
          uri: lb://blog-service
          order: -100
          predicates:
            - Path=${app.prefix-api}/blog/actuator/**
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: chatbot-health
          uri: lb://chatbot-service
          order: -100
          predicates:
            - Path=${app.prefix-api}/chatbot/actuator/**
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        # ===== Identity Service =====
        - id: identity-public
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/auth/**
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: identity-public-profile
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/users/*/profile
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: identity-private
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/users/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        - id: identity-admin
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/admin/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        - id: identity-storage
          uri: lb://identity-service
          predicates:
            - Path=${app.prefix-api}/identity/storage/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: identityServiceCircuitBreaker
                fallbackUri: forward:/fallback/identity-service

        # ===== Storage Service =====
        - id: storage-service
          uri: lb://course-service
          predicates:
            - Path=${app.prefix-api}/storage/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/course-service

        - id: course-private-read-shortcuts
          uri: lb://course-service
          order: -30
          predicates:
            - Path=${app.prefix-api}/course/courses/my,${app.prefix-api}/course/courses/enrolled
            - Method=GET
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/course-service

        - id: course-public-read
          uri: lb://course-service
          order: -20
          predicates:
            - Path=${app.prefix-api}/course/categories,${app.prefix-api}/course/courses,${app.prefix-api}/course/courses/*,${app.prefix-api}/course/courses/*/students/count,${app.prefix-api}/course/courses/*/lessons/count,${app.prefix-api}/course/courses/*/structure,${app.prefix-api}/course/courses/*/structure/lessons
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=${app.prefix-api}/course/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: courseServiceCircuitBreaker
                fallbackUri: forward:/fallback/course-service

        # ===== Assignment Service =====
        - id: assignment-quiz-ai-service
          uri: lb://assignment-service
          order: -20
          predicates:
            - Path=${app.prefix-api}/assignment/questions/courses/*/ai-generate/preview
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: assignmentAiServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        - id: assignment-testcase-ai-service
          uri: lb://assignment-service
          order: -20
          predicates:
            - Path=${app.prefix-api}/assignment/problems/testcases/ai-generate/preview
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: assignmentAiServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        - id: assignment-code-judge
          uri: lb://assignment-service
          order: -10
          predicates:
            - Path=${app.prefix-api}/assignment/problems/*/submit,${app.prefix-api}/assignment/problems/*/run-trial
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: assignmentJudgeCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        - id: assignment-service
          uri: lb://assignment-service
          order: 0
          predicates:
            - Path=${app.prefix-api}/assignment/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: assignmentServiceCircuitBreaker
                fallbackUri: forward:/fallback/assignment-service

        # ===== Blog Service =====
        - id: blog-public
          uri: lb://blog-service
          predicates:
            - Path=${app.prefix-api}/blog/posts/public,${app.prefix-api}/blog/posts/public/**,${app.prefix-api}/blog/tags,${app.prefix-api}/blog/tags/search,${app.prefix-api}/blog/posts/*/comments
            - Method=GET
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Authorization
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-User-Roles
            - RemoveRequestHeader=X-User-Email
            - RemoveRequestHeader=X-Gateway-Authenticated

        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=${app.prefix-api}/blog/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: blogServiceCircuitBreaker
                fallbackUri: forward:/fallback/blog-service

        # ===== Chatbot Service =====
        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=${app.prefix-api}/chatbot/**
          filters:
            - StripPrefix=1
            - AuthFilter
            - name: CircuitBreaker
              args:
                name: chatbotServiceCircuitBreaker
                fallbackUri: forward:/fallback/chatbot-service

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
    instances:
      identityServiceCircuitBreaker:
        timeout-duration: 10s
      courseServiceCircuitBreaker:
        timeout-duration: 15s
      assignmentServiceCircuitBreaker:
        timeout-duration: 15s
      assignmentJudgeCircuitBreaker:
        timeout-duration: 60s
      assignmentAiServiceCircuitBreaker:
        timeout-duration: 130s
      chatbotServiceCircuitBreaker:
        timeout-duration: 130s
      blogServiceCircuitBreaker:
        timeout-duration: 10s
