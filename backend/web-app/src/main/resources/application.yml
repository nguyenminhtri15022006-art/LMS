server:
  port: ${SERVER_PORT:8088}
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax

spring:
  application:
    name: web-app
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
  session:
    store-type: none

lms:
  gateway:
    base-url: ${GATEWAY_URL:http://localhost:8080/api}
  google:
    client-id: ${GOOGLE_CLIENT_ID:replace-with-google-client-id}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8088/auth/callback/google}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
