<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, contentBlock, scriptBlock)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">EduLearn LMS - Nền Tảng Học Trực Tuyến</title>

    <!-- Bootstrap 5 CSS via WebJar -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <!-- Bootstrap Icons via WebJar -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Navigation -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Main Content Body -->
    <main class="flex-grow-1" th:insert="${contentBlock}">
        <p>Nội dung mặc định</p>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- Bootstrap 5 JS Bundle via WebJar -->
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <!-- Custom JS block -->
    <th:block th:if="${scriptBlock != null}" th:insert="${scriptBlock}"></th:block>
</body>
</html>
