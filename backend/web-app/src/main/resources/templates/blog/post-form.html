<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#contentBlock}, ~{::#scriptBlock})}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Bài Viết' : 'Viết Bài Mới'} + ' — EduLearn Blog'">Soạn Thảo Bài Viết</title>
</head>
<body>

<div id="contentBlock" class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/blog}" class="text-decoration-none">Diễn đàn Blog</a></li>
            <li class="breadcrumb-item active" th:text="${isEdit ? 'Chỉnh sửa bài viết' : 'Viết bài mới'}">Viết bài mới</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex align-items-center justify-content-between pb-3 mb-4 border-bottom">
                    <div>
                        <h2 class="fw-bold mb-1" th:text="${isEdit ? 'Chỉnh Sửa Bài Viết' : 'Soạn Thảo Bài Viết Mới'}">Viết Bài Mới</h2>
                        <p class="text-muted small mb-0">Hỗ trợ định dạng văn bản Markdown chuẩn và tải lên ảnh bìa.</p>
                    </div>
                    <a th:href="@{/blog}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x-lg me-1"></i>Hủy
                    </a>
                </div>

                <form method="post"
                      th:action="${isEdit} ? @{'/blog/' + ${postForm.id} + '/edit'} : @{/blog/new}"
                      th:object="${postForm}"
                      enctype="multipart/form-data">

                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Error Flash -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Lỗi xử lý</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Title -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tiêu đề bài viết <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{title}" class="form-control form-control-lg rounded-3"
                               placeholder="Ví dụ: Hướng dẫn xây dựng kiến trúc Microservices với Spring Cloud" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <!-- Summary -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tóm tắt ngắn gọn</label>
                        <textarea th:field="*{summary}" class="form-control rounded-3" rows="2"
                                  placeholder="Mô tả súc tích về nội dung bài viết (tối đa 500 ký tự)..."></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
                    </div>

                    <!-- Tags -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Thẻ chủ đề (Tags)</label>
                        <div class="d-flex flex-wrap gap-2 p-3 bg-light rounded-3 border">
                            <div class="form-check me-3" th:each="t : ${tags}">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{tagIds}"
                                       th:value="${t.get('id').asLong()}"
                                       th:id="${'tag_' + t.get('id').asLong()}">
                                <label class="form-check-label small"
                                       th:for="${'tag_' + t.get('id').asLong()}"
                                       th:text="${t.get('name').asText()}">
                                    Java
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Cover Image Upload -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ảnh bìa bài viết (Cover Image)</label>
                        <input type="file" name="file" class="form-control rounded-3" accept="image/*">
                        <div class="form-text small">Hỗ trợ các định dạng PNG, JPG, JPEG, WebP. Kích thước khuyến nghị: 1200x630px.</div>
                    </div>

                    <!-- Content (Markdown) -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-bold mb-0">Nội dung chi tiết (Markdown) <span class="text-danger">*</span></label>
                            <span class="text-muted small"><i class="bi bi-markdown me-1"></i>Hỗ trợ Markdown</span>
                        </div>
                        <textarea th:field="*{content}" class="form-control font-monospace rounded-3" rows="15"
                                  placeholder="# Tiêu đề chương 1&#10;&#10;Nội dung bài viết được định dạng bằng Markdown..." required></textarea>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                    </div>

                    <!-- Status -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Trạng thái phát hành</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{status}" value="PUBLISHED" id="statusPublished">
                                <label class="form-check-label fw-medium" for="statusPublished">
                                    <i class="bi bi-globe-americas text-success me-1"></i>Công khai ngay (Published)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{status}" value="DRAFT" id="statusDraft">
                                <label class="form-check-label fw-medium" for="statusDraft">
                                    <i class="bi bi-file-earmark-lock text-secondary me-1"></i>Lưu bản nháp (Draft)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/blog}" class="btn btn-light px-4">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-5 shadow-sm" id="btnSubmitPost">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="${isEdit ? 'Cập Nhật Bài Viết' : 'Đăng Bài Viết'}">Đăng Bài Viết</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block id="scriptBlock">
    <!-- Scripts -->
</th:block>
</body>
</html>
