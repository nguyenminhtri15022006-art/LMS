<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#loginContent}, ~{})}">
<head>
    <title>Đăng Nhập - EduLearn LMS</title>
</head>
<body>
<div id="loginContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle display-4 text-primary"></i>
                        <h2 class="fw-bold mt-2">Đăng Nhập</h2>
                        <p class="text-muted">Chào mừng bạn quay lại hệ thống EduLearn LMS</p>
                    </div>

                    <!-- Flash messages / Errors -->
                    <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${loginError}">Lỗi đăng nhập</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Thông báo thành công</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${infoMessage}">Thông báo thông tin</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" th:object="${loginForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" th:field="*{username}" class="form-control"
                                       placeholder="Nhập tên đăng nhập" required autofocus />
                            </div>
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold mb-0">Mật khẩu</label>
                                <a th:href="@{/forgot-password}" class="text-decoration-none small text-primary">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control"
                                       placeholder="Nhập mật khẩu" required />
                            </div>
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 text-muted" />
                        <span class="px-3 text-muted small fw-semibold">HOẶC</span>
                        <hr class="flex-grow-1 text-muted" />
                    </div>

                    <!-- Google OAuth Login -->
                    <a th:href="@{/auth/google}" class="btn btn-outline-danger w-100 py-2 fw-semibold shadow-sm">
                        <i class="bi bi-google me-2"></i>Đăng nhập với Google
                    </a>

                    <!-- Register Link -->
                    <div class="text-center mt-4 text-muted small">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
