<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#loginContent}, ~{})}">
<head>
    <title>Đăng Nhập - LMS EduLearn</title>
</head>
<body>
<div id="loginContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card-modern p-4 p-md-5">
                <div class="card-body p-0">
                    <div class="text-center mb-4">
                        <div class="otp-icon-wrapper mx-auto">
                            <i class="bi bi-person-circle fs-1"></i>
                        </div>
                        <h2 class="fw-bold mt-2 text-dark">Đăng Nhập</h2>
                        <p class="text-muted small">Chào mừng bạn quay lại hệ thống LMS EduLearn</p>
                    </div>

                    <!-- Flash messages / Errors -->
                    <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show rounded-3 small" role="alert">
                        <div class="d-flex align-items-start gap-2">
                            <i class="bi bi-exclamation-triangle-fill mt-1 flex-shrink-0"></i>
                            <div class="flex-grow-1">
                                <span th:text="${loginError}">Lỗi đăng nhập</span>
                                <div th:if="${unverifiedUser}" class="mt-2 pt-2 border-top border-danger-subtle">
                                    <a th:href="@{/verify-email(email=${unverifiedEmail})}" class="btn btn-sm btn-danger text-white fw-semibold shadow-xs d-inline-flex align-items-center gap-1">
                                        <i class="bi bi-shield-check"></i>
                                        <span>Kích hoạt ngay bằng mã OTP</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 small" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Thông báo thành công</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show rounded-3 small" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${infoMessage}">Thông báo thông tin</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" th:object="${loginForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small text-muted">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" th:field="*{username}" class="form-control border-start-0"
                                       placeholder="Nhập tên đăng nhập" required autofocus />
                            </div>
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold small text-muted mb-0">Mật khẩu</label>
                                <a th:href="@{/forgot-password}" class="text-decoration-none small text-primary fw-medium">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control border-start-0"
                                       placeholder="Nhập mật khẩu" required />
                            </div>
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 text-muted opacity-25" />
                        <span class="px-3 text-muted small fw-semibold">HOẶC</span>
                        <hr class="flex-grow-1 text-muted opacity-25" />
                    </div>

                    <!-- Google OAuth Login -->
                    <a th:href="@{/auth/google}" class="btn btn-outline-danger w-100 py-2 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-google"></i>
                        <span>Đăng nhập với Google</span>
                    </a>

                    <!-- Register Link -->
                    <div class="text-center mt-4 text-muted small">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
