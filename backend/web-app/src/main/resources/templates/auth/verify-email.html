<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#verifyContent}, ~{::#verifyScripts})}">
<head>
    <title>Xác Thực Email - EduLearn LMS</title>
</head>
<body>
<div id="verifyContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-envelope-check-fill display-4 text-primary"></i>
                        <h2 class="fw-bold mt-2">Xác Thực Email</h2>
                        <p class="text-muted" th:unless="${otpDeliveryFailed == true}">Vui lòng nhập mã OTP 6 chữ số đã được gửi tới email của bạn</p>
                        <p th:if="${otpDeliveryFailed == true}" class="alert alert-warning" role="alert">
                            Tài khoản đã được tạo nhưng chưa gửi được mã xác thực. Vui lòng bấm Gửi lại mã OTP.
                        </p>
                    </div>

                    <div th:if="${otpError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${otpError}">Lỗi mã OTP</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/verify-email}" th:object="${verifyOtpForm}" method="post" id="otpForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3 text-start">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="name@example.com" required readonly />
                        </div>

                        <div class="mb-4 text-start">
                            <label for="otp" class="form-label fw-semibold">Mã OTP (6 chữ số)</label>
                            <input type="text" id="otp" th:field="*{otp}" class="form-control form-control-lg text-center fw-bold letter-spacing-2"
                                   placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autofocus />
                            <div th:if="${#fields.hasErrors('otp')}" class="text-danger small mt-1" th:errors="*{otp}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-check2-circle me-2"></i>Xác Nhận OTP
                        </button>
                    </form>

                    <!-- Countdown & Resend -->
                    <div class="mt-3">
                        <div id="resendAlert" class="alert alert-danger alert-dismissible fade show d-none text-start small mb-2" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span id="resendAlertMessage"></span>
                            <button type="button" class="btn-close btn-close-sm" aria-label="Close" onclick="document.getElementById('resendAlert').classList.add('d-none')"></button>
                        </div>
                        <div id="resendSuccessAlert" class="alert alert-success alert-dismissible fade show d-none text-start small mb-2" role="alert">
                            <i class="bi bi-check-circle-fill me-1"></i>
                            <span id="resendSuccessAlertMessage"></span>
                            <button type="button" class="btn-close btn-close-sm" aria-label="Close" onclick="document.getElementById('resendSuccessAlert').classList.add('d-none')"></button>
                        </div>
                        <p class="text-muted small mb-1">
                            Có thể gửi lại mã sau <span id="countdownTimer" th:attr="data-delivery-failed=${otpDeliveryFailed == true}" class="fw-bold text-danger">60</span> giây.
                        </p>
                        <button type="button" id="resendOtpBtn" class="btn btn-link text-decoration-none small text-primary p-0" th:disabled="${otpDeliveryFailed != true}">
                            <i class="bi bi-arrow-clockwise me-1"></i><span id="resendBtnText">Gửi lại mã OTP</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="verifyScripts">
    <script th:src="@{/js/otp-countdown.js}"></script>
</th:block>
</body>
</html>
