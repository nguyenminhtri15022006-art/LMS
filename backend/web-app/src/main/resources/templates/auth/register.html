<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#registerContent}, ~{})}">
<head>
    <title>Đăng Ký Tài Khoản - LMS EduLearn</title>
</head>
<body>
<div id="registerContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card auth-card-modern p-4 p-md-5">
                <div class="card-body p-0">
                    <div class="text-center mb-4">
                        <div class="otp-icon-wrapper mx-auto">
                            <i class="bi bi-person-plus-fill fs-1"></i>
                        </div>
                        <h2 class="fw-bold mt-2 text-dark">Tạo Tài Khoản</h2>
                        <p class="text-muted small">Bắt đầu hành trình học tập cùng LMS EduLearn</p>
                    </div>

                    <div th:if="${registerError}" class="alert alert-danger alert-dismissible fade show rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${registerError}">Lỗi đăng ký</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="fullname" class="form-label fw-semibold small text-muted">Họ và tên</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-text"></i></span>
                                <input type="text" id="fullname" th:field="*{fullname}" class="form-control border-start-0"
                                       placeholder="Ví dụ: Nguyễn Văn A" />
                            </div>
                            <div th:if="${#fields.hasErrors('fullname')}" class="text-danger small mt-1" th:errors="*{fullname}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small text-muted">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" th:field="*{username}" class="form-control border-start-0"
                                       placeholder="Ví dụ: nguyenvana" required autofocus />
                            </div>
                            <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-1" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-muted">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control border-start-0"
                                       placeholder="name@example.com" required />
                            </div>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-muted">Mật khẩu (tối thiểu 8 ký tự)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" th:field="*{password}" class="form-control border-start-0"
                                       placeholder="Nhập mật khẩu từ 8 ký tự" required />
                            </div>
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold small text-muted">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control border-start-0"
                                       placeholder="Nhập lại mật khẩu" required />
                            </div>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-check-circle me-2"></i>Đăng Ký Tài Khoản
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        Đã có tài khoản?
                        <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Đăng nhập ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
