<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#resetContent}, ~{})}">
<head>
    <title>Đặt Lại Mật Khẩu - EduLearn LMS</title>
</head>
<body>
<div id="resetContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-shield-lock-fill display-4 text-success"></i>
                        <h2 class="fw-bold mt-2">Đặt Lại Mật Khẩu</h2>
                        <p class="text-muted">Nhập mã OTP và mật khẩu mới để khôi phục tài khoản</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Lỗi đặt lại mật khẩu</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3 text-start">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="name@example.com" required readonly />
                        </div>

                        <div class="mb-3 text-start">
                            <label for="otp" class="form-label fw-semibold">Mã OTP (6 chữ số)</label>
                            <input type="text" id="otp" th:field="*{otp}" class="form-control text-center fw-bold"
                                   placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autofocus />
                            <div th:if="${#fields.hasErrors('otp')}" class="text-danger small mt-1" th:errors="*{otp}"></div>
                        </div>

                        <div class="mb-3 text-start">
                            <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới (tối thiểu 8 ký tự)</label>
                            <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                                   placeholder="Nhập mật khẩu mới" required />
                            <div th:if="${#fields.hasErrors('newPassword')}" class="text-danger small mt-1" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-4 text-start">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                   placeholder="Nhập lại mật khẩu mới" required />
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-check-lg me-2"></i>Cập Nhật Mật Khẩu
                        </button>
                    </form>

                    <div class="mt-3">
                        <a th:href="@{/login}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>Hủy và quay lại Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
