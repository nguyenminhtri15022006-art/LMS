<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#forgotContent}, ~{})}">
<head>
    <title>Quên Mật Khẩu - EduLearn LMS</title>
</head>
<body>
<div id="forgotContent" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-4 text-center">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-key-fill display-4 text-warning"></i>
                        <h2 class="fw-bold mt-2">Quên Mật Khẩu</h2>
                        <p class="text-muted">Nhập email đăng ký để nhận mã OTP khôi phục mật khẩu</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Lỗi gửi yêu cầu</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-4 text-start">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control"
                                       placeholder="name@example.com" required autofocus />
                            </div>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold shadow-sm mb-3 text-dark">
                            <i class="bi bi-send me-2"></i>Gửi Mã Khôi Phục
                        </button>
                    </form>

                    <div class="mt-3">
                        <a th:href="@{/login}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại trang Đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
