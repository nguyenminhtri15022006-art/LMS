<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"

<head>

                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold me-2">

                    <a th:href="@{/login}" class="btn btn-outline-secondary px-4 fw-semibold">

    </div>
