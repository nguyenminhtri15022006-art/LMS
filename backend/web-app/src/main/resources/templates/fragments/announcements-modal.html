<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Fragment Modal Thông Báo -->
<div th:fragment="announcementsModal" class="modal fade" id="announcementsModal" tabindex="-1" aria-labelledby="announcementsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="announcementsModalLabel">
                    <i class="bi bi-megaphone me-2 text-primary"></i>Thông Báo Giảng Viên
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <!-- State: Loading -->
                <div id="announcementsLoading" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <p class="text-muted small mt-2 mb-0">Đang tải thông báo...</p>
                </div>

                <!-- State: Error -->
                <div id="announcementsError" class="alert alert-danger d-none my-2 small" role="alert">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span id="announcementsErrorMsg">Không thể tải thông báo từ hệ thống.</span>
                        </div>
                        <button type="button" id="announcementsRetryBtn" class="btn btn-sm btn-outline-danger">Thử lại</button>
                    </div>
                </div>

                <!-- State: Empty -->
                <div id="announcementsEmpty" class="text-center py-4 text-muted d-none">
                    <i class="bi bi-chat-dots display-4 text-muted"></i>
                    <p class="mt-2 mb-0">Chưa có thông báo nào từ giảng viên.</p>
                </div>

                <!-- State: Success Content -->
                <div id="announcementsContent" class="list-group list-group-flush d-none">
                    <!-- Dynamic Announcements rendered by JS -->
                </div>

                <!-- Pagination controls -->
                <div id="announcementsPagination" class="d-flex justify-content-between align-items-center pt-3 mt-3 border-top d-none">
                    <span class="small text-muted" id="announcementsPageInfo">Trang 1 / 1</span>
                    <div class="btn-group btn-group-sm">
                        <button type="button" id="announcementsPrevBtn" class="btn btn-outline-secondary" disabled>
                            <i class="bi bi-chevron-left me-1"></i>Trang trước
                        </button>
                        <button type="button" id="announcementsNextBtn" class="btn btn-outline-secondary" disabled>
                            Trang sau<i class="bi bi-chevron-right ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
