<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment Render Cây Bình Luận Đa Cấp Đệ Quy -->
<th:block th:fragment="commentThread(comments, depth)">
    <div th:each="c : ${comments}"
         class="comment-card border rounded-3 p-3 bg-white mb-2 shadow-xs"
         th:classappend="${depth > 0} ? 'ms-3 ms-md-4 border-start border-3 border-primary-subtle' : ''"
         th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}, data-parent-id=${c.hasNonNull('parentId') ? c.get('parentId').asLong() : ''}">

        <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex align-items-center gap-2">
                <img th:if="${c.hasNonNull('authorAvatar') and !#strings.isEmpty(c.get('authorAvatar').asText())}"
                     th:src="${c.get('authorAvatar').asText()}"
                     class="rounded-circle border"
                     style="width: 28px; height: 28px; object-fit: cover;"
                     th:alt="${c.hasNonNull('authorName') ? c.get('authorName').asText() : 'Avatar'}">
                <i th:unless="${c.hasNonNull('authorAvatar') and !#strings.isEmpty(c.get('authorAvatar').asText())}"
                   class="bi bi-person-circle fs-5 text-secondary"></i>
                <span class="fw-bold small comment-author-name"
                      th:text="${c.hasNonNull('authorName') ? c.get('authorName').asText() : 'Người dùng'}">
                    Người dùng
                </span>
                <span class="text-muted small"
                      th:text="${c.hasNonNull('createdAt') ? c.get('createdAt').asText() : ''}">
                    Thời gian
                </span>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-1 align-items-center">
                <!-- Chỉ bình luận gốc (depth == 0) mới được phép trả lời (nghiệp vụ tối đa 2 cấp) -->
                <button type="button" class="btn btn-sm btn-link text-decoration-none btn-reply-comment text-secondary p-0 me-2"
                        th:if="${depth == 0}"
                        th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                    <i class="bi bi-reply me-1"></i>Trả lời
                </button>
                <button type="button" class="btn btn-sm btn-link text-decoration-none btn-edit-comment text-primary p-0 me-2"
                        th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                    <i class="bi bi-pencil me-1"></i>Sửa
                </button>
                <button type="button" class="btn btn-sm btn-link text-decoration-none btn-delete-comment text-danger p-0"
                        th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                    <i class="bi bi-trash me-1"></i>Xóa
                </button>
            </div>
        </div>

        <!-- Comment Content -->
        <p class="comment-text mb-2 text-dark small" th:text="${c.hasNonNull('content') ? c.get('content').asText() : ''}">
            Nội dung bình luận...
        </p>

        <!-- Comment Vote Buttons -->
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 btn-vote-comment"
                    data-vote-type="UPVOTE"
                    th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                <i class="bi bi-hand-thumbs-up"></i>
                <span class="comment-upvote-count small" th:text="${c.hasNonNull('upvoteCount') ? c.get('upvoteCount').asLong() : 0}">0</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 btn-vote-comment"
                    data-vote-type="DOWNVOTE"
                    th:attr="data-comment-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                <i class="bi bi-hand-thumbs-down"></i>
                <span class="comment-downvote-count small" th:text="${c.hasNonNull('downvoteCount') ? c.get('downvoteCount').asLong() : 0}">0</span>
            </button>
        </div>

        <!-- Reply Box Container (Chỉ hiển thị cho bình luận gốc depth == 0) -->
        <div class="reply-box-container mt-3 d-none" th:if="${depth == 0}">
            <div class="card border rounded-2 p-2 bg-light">
                <textarea class="form-control form-control-sm mb-2 reply-input" rows="2" placeholder="Nhập câu trả lời..."></textarea>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-sm btn-light btn-cancel-reply">Hủy</button>
                    <button type="button" class="btn btn-sm btn-primary btn-submit-reply"
                            th:attr="data-parent-id=${c.hasNonNull('id') ? c.get('id').asLong() : 0}">
                        Gửi trả lời
                    </button>
                </div>
            </div>
        </div>

        <!-- Đệ Quy Render Các Bình Luận Con / Cháu -->
        <div class="nested-replies-container mt-2"
             th:if="${c.has('replies') and c.get('replies').isArray() and !c.get('replies').isEmpty()}">
            <th:block th:replace="~{fragments/comment-thread :: commentThread(${c.get('replies')}, ${depth + 1})}"></th:block>
        </div>
    </div>
</th:block>

</body>
</html>
