<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <span class="brand-icon-box">
                <i class="bi bi-mortarboard-fill"></i>
            </span>
            <span>LMS EduLearn</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/courses}"><i class="bi bi-book me-1"></i>Khóa học</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/blog}"><i class="bi bi-journal-text me-1"></i>Diễn đàn</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                <th:block sec:authorize="isAnonymous()">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary btn-sm px-3 shadow-sm" th:href="@{/register}">
                            <i class="bi bi-person-plus me-1"></i>Đăng ký
                        </a>
                    </li>
                </th:block>
                <th:block sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="badge rounded-circle bg-primary-subtle text-primary p-2">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <span sec:authentication="name" class="fw-semibold">Tài khoản</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/profile}">
                                    <i class="bi bi-person me-2 text-primary"></i>Hồ sơ cá nhân
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/my-courses}">
                                    <i class="bi bi-collection-play me-2 text-primary"></i>Khóa học của tôi
                                </a>
                            </li>
                            <li sec:authorize="hasAnyRole('INSTRUCTOR', 'TEACHER', 'ADMIN')">
                                <a class="dropdown-item" th:href="@{/instructor/courses}">
                                    <i class="bi bi-easel me-2 text-warning"></i>Studio Giảng viên
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" th:href="@{/admin}">
                                    <i class="bi bi-shield-lock me-2 text-danger"></i>Quản trị hệ thống
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
