<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<ul th:fragment="tree(nodes, courseId, currentLessonId, learning)" class="list-unstyled mb-0 course-tree">
    <li th:each="node : ${nodes}" class="course-tree-node" th:data-node-id="${node.id}">
        <th:block th:if="${node.type != null and node.type.equalsIgnoreCase('FOLDER')}">
            <div class="bg-light fw-semibold text-secondary small py-2 px-3">
                <i class="bi bi-folder2-open me-2 text-warning"></i><span th:text="${node.title}">Chương</span>
            </div>
            <div th:if="${node.items != null and !node.items.isEmpty()}" class="ms-3 ps-2 border-start">
                <th:block th:replace="~{fragments/course-tree :: tree(${node.items}, ${courseId}, ${currentLessonId}, ${learning})}"></th:block>
            </div>
        </th:block>
        <th:block th:if="${node.type != null and node.type.equalsIgnoreCase('LESSON')}">
            <a th:if="${learning and node.lessonId != null}"
               th:href="@{'/learn/' + ${courseId} + '/lessons/' + ${node.lessonId}}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 px-3 small"
               th:classappend="${node.lessonId == currentLessonId} ? 'active' : ''"
               th:data-lesson-id="${node.lessonId}">
                <span class="text-truncate">
                    <i th:class="${node.lessonType != null and node.lessonType.equalsIgnoreCase('VIDEO')} ? 'bi bi-play-circle me-2' : 'bi bi-file-earmark-text me-2'"></i>
                    <span th:text="${node.title}">Bài học</span>
                </span>
                <span class="lesson-check-icon" th:data-checked="${node.completed}">
                    <i th:if="${node.completed}" class="bi bi-check-circle-fill text-success ms-2"></i>
                </span>
            </a>
            <div th:unless="${learning and node.lessonId != null}" class="d-flex justify-content-between align-items-center py-2 px-3">
                <span class="small fw-semibold">
                    <i th:class="${node.lessonType != null and node.lessonType.equalsIgnoreCase('VIDEO')} ? 'bi bi-play-circle me-2' : 'bi bi-file-earmark-text me-2'"></i>
                    <span th:text="${node.title}">Bài học</span>
                </span>
                <span class="badge bg-secondary-subtle text-secondary" th:text="${node.lessonType}">DOCUMENT</span>
            </div>
        </th:block>
    </li>
</ul>
</body>
</html>
