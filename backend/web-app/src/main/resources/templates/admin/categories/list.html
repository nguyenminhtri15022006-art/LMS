<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#adminCategoriesContent}, ~{::#adminScripts})}">
<head>
    <title>Quản Lý Thể Loại Khóa Học - EduLearn LMS Admin</title>
</head>
<body>
<div id="adminCategoriesContent" class="container py-4">
    <!-- Admin Navigation -->
    <div th:replace="~{fragments/admin-nav :: adminNav('categories')}"></div>

    <!-- Header Actions -->
    <div class="card shadow-sm border-0 rounded-3 mb-4 bg-white">
        <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-folder-fill text-info me-2"></i>Thể Loại Khóa Học</h4>
                <p class="text-muted small mb-0">Quản lý danh mục phân loại bài giảng trên toàn hệ thống EduLearn</p>
            </div>
            <button type="button" class="btn btn-primary fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="prepareCategoryModal('add')">
                <i class="bi bi-plus-circle me-1"></i>Thêm Thể Loại Mới
            </button>
        </div>
    </div>

    <!-- Categories Table -->
    <div class="card shadow-sm border-0 rounded-3 bg-white">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="ps-4" style="width: 80px;">ID</th>
                            <th>Tên Thể Loại</th>
                            <th>Đường Dẫn Slug</th>
                            <th class="text-end pe-4" style="width: 150px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:if="${categories != null && categories.size() > 0}">
                            <tr th:each="cat : ${categories}">
                                <td class="ps-4 fw-bold text-secondary" th:text="${cat.has('id')} ? ${cat.get('id').asText()} : '—'">1</td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${cat.has('name')} ? ${cat.get('name').asText()} : 'Tên thể loại'">Lập trình Web</div>
                                </td>
                                <td>
                                    <code class="text-primary bg-light px-2 py-1 rounded" th:text="${cat.has('slug')} ? ${cat.get('slug').asText()} : 'slug'">lap-trinh-web</code>
                                </td>
                                <td class="text-end pe-4">
                                    <div class="btn-group btn-group-sm">
                                        <!-- Nút Sửa -->
                                        <button type="button" class="btn btn-outline-secondary btn-edit-category"
                                                th:attr="data-cat-id=${cat.get('id').asText()}, data-cat-name=${cat.get('name').asText()}, data-cat-slug=${cat.has('slug') ? cat.get('slug').asText() : ''}"
                                                title="Chỉnh sửa">
                                            <i class="bi bi-pencil-fill text-primary"></i>
                                        </button>

                                        <!-- Nút Xóa -->
                                        <form th:action="@{/admin/categories/{id}/delete(id=${cat.get('id').asText()})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa thể loại này? Các khóa học thuộc thể loại này sẽ mất liên kết.');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-secondary" title="Xóa thể loại">
                                                <i class="bi bi-trash3-fill text-danger"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </th:block>
                        <tr th:if="${categories == null || categories.size() == 0}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-folder-x fs-1 d-block mb-2 text-secondary"></i>
                                Chưa có thể loại nào được tạo.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm / Sửa Category -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <form id="categoryForm" method="post" th:action="@{/admin/categories}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header bg-primary bg-opacity-10">
                        <h5 class="modal-title fw-bold text-dark" id="categoryModalLabel"><i class="bi bi-folder-plus text-primary me-2"></i>Thêm Thể Loại Mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên thể loại <span class="text-danger">*</span></label>
                            <input type="text" id="catInputName" name="name" class="form-control" placeholder="Ví dụ: Lập trình Java" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Slug (Đường dẫn thân thiện) <span class="text-danger">*</span></label>
                            <input type="text" id="catInputSlug" name="slug" class="form-control" placeholder="lap-trinh-java" required maxlength="100">
                            <div class="form-text small">Tự động tạo từ tên hoặc nhập thủ công (không dấu, cách nhau bởi gạch nối)</div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" id="btnSubmitCategory" class="btn btn-primary fw-semibold px-4"><i class="bi bi-check-lg me-1"></i>Lưu Thể Loại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block id="adminScripts">
    <script th:src="@{/js/admin-actions.js}"></script>
</th:block>
</body>
</html>
