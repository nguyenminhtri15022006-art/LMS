<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::#profileContent}, ~{::#profileScripts})}">
<head>
    <title>Hồ Sơ Cá Nhân - EduLearn LMS</title>
</head>
<body>
<div id="profileContent" class="container py-5">
    <div class="row">
        <!-- Sidebar Profile Summary -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm border-0 rounded-4 text-center p-4">
                <div class="card-body">
                    <div class="position-relative d-inline-block mb-3">
                        <img id="avatarImage"
                             th:src="${profile != null && profile.hasNonNull('avatarUrl') && !profile.get('avatarUrl').asText().isEmpty()} ? ${profile.get('avatarUrl').asText()} : @{/images/default-avatar.svg}"
                             class="rounded-circle border border-3 border-primary shadow-sm"
                             style="width: 130px; height: 130px; object-fit: cover;"
                             alt="Avatar" />
                        <label for="avatarFileInput" class="btn btn-sm btn-primary rounded-circle position-absolute bottom-0 end-0 shadow"
                               title="Đổi ảnh đại diện">
                            <i class="bi bi-camera-fill"></i>
                        </label>
                        <input type="file" id="avatarFileInput" class="d-none" accept="image/png,image/jpeg,image/webp" />
                    </div>

                    <!-- Upload progress indicator -->
                    <div id="avatarUploadProgress" class="progress d-none mb-3" style="height: 6px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 100%;"></div>
                    </div>
                    <div id="avatarUploadMessage" class="small text-muted mb-2"></div>

                    <h4 class="fw-bold mb-1" th:text="${profile != null && profile.hasNonNull('fullName')} ? ${profile.get('fullName').asText()} : 'Người dùng EduLearn'">Họ và tên</h4>
                    <p class="text-muted small mb-2">
                        @<span th:text="${profile != null && profile.hasNonNull('username')} ? ${profile.get('username').asText()} : ${session.username}">username</span>
                    </p>
                    <p class="text-muted small mb-3">
                        <i class="bi bi-envelope me-1"></i>
                        <span th:text="${profile != null && profile.hasNonNull('email')} ? ${profile.get('email').asText()} : ''">email@example.com</span>
                    </p>

                    <div>
                        <span th:if="${profile != null && profile.hasNonNull('role') && profile.get('role').asText() == 'ADMIN'}"
                              class="badge bg-danger px-3 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-shield-lock me-1"></i>Quản Trị Viên
                        </span>
                        <span th:if="${profile != null && profile.hasNonNull('role') && profile.get('role').asText() == 'INSTRUCTOR'}"
                              class="badge bg-success px-3 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-mortarboard me-1"></i>Giảng Viên
                        </span>
                        <span th:if="${profile == null || !profile.hasNonNull('role') || profile.get('role').asText() == 'STUDENT'}"
                              class="badge bg-primary px-3 py-2 rounded-pill fw-semibold">
                            <i class="bi bi-book me-1"></i>Học Viên
                        </span>
                    </div>
                </div>
            </div>

            <!-- Role Switch Card -->
            <div class="card shadow-sm border-0 rounded-4 mt-4 p-3">
                <div class="card-body">
                    <h5 class="fw-bold mb-3"><i class="bi bi-person-gear text-primary me-2"></i>Chuyển Đổi Vai Trò</h5>
                    <p class="text-muted small">Bạn có thể linh hoạt chuyển đổi giữa vai trò Học viên và Giảng viên để trải nghiệm hệ sinh thái giảng dạy.</p>

                    <form th:action="@{/profile/role}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="mb-3">
                            <select name="role" class="form-select">
                                <option value="STUDENT" th:selected="${profile != null && profile.hasNonNull('role') && profile.get('role').asText() == 'STUDENT'}">
                                    Học Viên (STUDENT)
                                </option>
                                <option value="INSTRUCTOR" th:selected="${profile != null && profile.hasNonNull('role') && profile.get('role').asText() == 'INSTRUCTOR'}">
                                    Giảng Viên (INSTRUCTOR)
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-outline-primary w-100 fw-semibold">
                            <i class="bi bi-arrow-repeat me-1"></i>Lưu Vai Trò Mới
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main Profile Tabs & Forms -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="card-body">
                    <!-- Nav Tabs -->
                    <ul class="nav nav-tabs nav-fill mb-4" id="profileTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold" id="info-tab" data-bs-toggle="tab"
                                    data-bs-target="#infoTabContent" type="button" role="tab">
                                <i class="bi bi-person-lines-fill me-2"></i>Thông Tin Cá Nhân
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold" id="password-tab" data-bs-toggle="tab"
                                    data-bs-target="#passwordTabContent" type="button" role="tab">
                                <i class="bi bi-shield-lock me-2"></i>Đổi Mật Khẩu
                            </button>
                        </li>
                    </ul>

                    <!-- Tab Contents -->
                    <div class="tab-content" id="profileTabContent">
                        <!-- Tab 1: Info Form -->
                        <div class="tab-pane fade show active" id="infoTabContent" role="tabpanel">
                            <form th:action="@{/profile}" th:object="${profileUpdateForm}" method="post" id="profileForm">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" id="profileAvatarUrl" th:field="*{avatarUrl}" />

                                <div class="mb-3">
                                    <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                           placeholder="Nguyễn Văn A" />
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"
                                           placeholder="0912345678" />
                                </div>

                                <div class="mb-4">
                                    <label for="bio" class="form-label fw-semibold">Tiểu sử (Bio)</label>
                                    <textarea id="bio" th:field="*{bio}" rows="4" class="form-control"
                                              placeholder="Mô tả ngắn về bạn, mục tiêu học tập hoặc kỹ năng giảng dạy..."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                                    <i class="bi bi-save me-2"></i>Lưu Thay Đổi
                                </button>
                            </form>
                        </div>

                        <!-- Tab 2: Change Password Form -->
                        <div class="tab-pane fade" id="passwordTabContent" role="tabpanel">
                            <form th:action="@{/profile/password}" th:object="${changePasswordForm}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label for="currentPassword" class="form-label fw-semibold">Mật khẩu hiện tại</label>
                                    <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control"
                                           placeholder="Nhập mật khẩu hiện tại" required />
                                    <div th:if="${#fields.hasErrors('currentPassword')}" class="text-danger small mt-1" th:errors="*{currentPassword}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="profileNewPassword" class="form-label fw-semibold">Mật khẩu mới (tối thiểu 8 ký tự)</label>
                                    <input type="password" id="profileNewPassword" th:field="*{newPassword}" class="form-control"
                                           placeholder="Nhập mật khẩu mới" required />
                                    <div th:if="${#fields.hasErrors('newPassword')}" class="text-danger small mt-1" th:errors="*{newPassword}"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="profileConfirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                                    <input type="password" id="profileConfirmPassword" th:field="*{confirmPassword}" class="form-control"
                                           placeholder="Nhập lại mật khẩu mới" required />
                                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                                </div>

                                <button type="submit" class="btn btn-warning px-4 py-2 fw-semibold shadow-sm text-dark">
                                    <i class="bi bi-key me-2"></i>Cập Nhật Mật Khẩu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="profileScripts">
    <script th:src="@{/js/avatar-upload.js}"></script>
</th:block>
</body>
</html>
