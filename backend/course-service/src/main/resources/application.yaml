server:
  port: ${COURSE_SERVICE_PORT:8082}
  servlet:
    context-path: /course

spring:
  application:
    name: course-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${COURSE_DB_URL:jdbc:mysql://localhost:3306/course_lms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${COURSE_DB_USERNAME:root}
    password: ${COURSE_DB_PASSWORD:mysqladmin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CourseHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongoadmin:mongoadmin123@localhost:27017/course_lms_mongo?authSource=admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

services:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}
  assignment-service:
    url: ${ASSIGNMENT_SERVICE_URL:http://localhost:8083/assignment}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET:lms-course-bucket}
  presigned-expiry-minutes: ${COURSE_MINIO_PRESIGNED_EXPIRY_MINUTES:60}

