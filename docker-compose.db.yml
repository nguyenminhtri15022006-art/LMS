services:
  # 1. DATABASE MYSQL 8.4 (Identity, Course, Assignment, Blog)
  mysql:
    image: mysql:8.4
    container_name: lms-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqladmin123}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./docker/mysql/seed:/docker-seed:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-mysqladmin123} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  # 2. DATABASE MONGODB 7.0 (Course, Assignment, Chatbot)
  mongodb:
    image: mongo:7.0
    container_name: lms-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongoadmin123}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - lms-network

  # 3. REDIS 7.2 (Cache, Rate Limiter)
  redis:
    image: redis:7.2-alpine
    container_name: lms-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redisadmin123}", "--appendonly", "yes" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisadmin123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisadmin123}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lms-network

  # 4. MINIO (Object Storage)
  minio:
    image: minio/minio:latest
    container_name: lms-minio
    restart: always
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  # 5. MAILPIT (Mock SMTP & REST API v1 cho Email OTP E2E Test)
  mail-server:
    image: axllent/mailpit:latest
    container_name: lms-mail-server
    restart: always
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  minio_data:
